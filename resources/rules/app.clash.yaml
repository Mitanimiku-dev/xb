  - { name: Bilibili, type: select, icon: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/icon/color/bilibili.png', proxies: ['🎯Direct','$app_name'] }
  - { name: Microsoft, type: select, icon: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/icon/qure/color/Microsoft.png', proxies: ['$app_name','🎯Direct'] }
